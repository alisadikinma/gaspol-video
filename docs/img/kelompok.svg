<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Per-kelompok delivery</title>
  <desc id="d">A batch of at most five scenes goes through voice, clips, audit and cut before the next batch. A final pass joins the approved batches.</desc>
  <rect width="1200" height="400" rx="20" fill="#0b1020"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="42" font-size="22" font-weight="700" fill="#e2e8f0">A mistake costs five scenes, not the whole film.</text>

    <!-- timeline of scenes -->
    <g>
      <rect x="40" y="70" width="1120" height="64" rx="12" fill="#111a33"/>
      <g fill="#f59e0b"><rect x="52" y="82" width="60" height="40" rx="6"/><rect x="118" y="82" width="60" height="40" rx="6"/><rect x="184" y="82" width="60" height="40" rx="6"/><rect x="250" y="82" width="60" height="40" rx="6"/><rect x="316" y="82" width="60" height="40" rx="6"/></g>
      <g fill="#22d3ee"><rect x="392" y="82" width="60" height="40" rx="6"/><rect x="458" y="82" width="60" height="40" rx="6"/><rect x="524" y="82" width="60" height="40" rx="6"/><rect x="590" y="82" width="60" height="40" rx="6"/><rect x="656" y="82" width="60" height="40" rx="6"/></g>
      <g fill="#a78bfa"><rect x="732" y="82" width="60" height="40" rx="6"/><rect x="798" y="82" width="60" height="40" rx="6"/><rect x="864" y="82" width="60" height="40" rx="6"/><rect x="930" y="82" width="60" height="40" rx="6"/><rect x="996" y="82" width="60" height="40" rx="6"/></g>
      <rect x="1072" y="82" width="76" height="40" rx="6" fill="#334155" stroke="#64748b" stroke-dasharray="4 3"/>
      <text x="1110" y="107" font-size="13" fill="#94a3b8">…</text>
      <text x="214" y="156" font-size="13" fill="#fbbf24" font-weight="700">KELOMPOK 1</text>
      <text x="554" y="156" font-size="13" fill="#67e8f9" font-weight="700">KELOMPOK 2</text>
      <text x="894" y="156" font-size="13" fill="#c4b5fd" font-weight="700">KELOMPOK 3</text>
    </g>

    <!-- steps for one kelompok -->
    <g font-size="14" font-weight="600" fill="#fff">
      <rect x="40"  y="190" width="150" height="64" rx="12" fill="#1e293b" stroke="#475569"/><text x="115" y="217">1 Narration</text><text x="115" y="238" font-size="12" font-weight="400" fill="#94a3b8">length sets the clip</text>
      <rect x="215" y="190" width="150" height="64" rx="12" fill="#1e293b" stroke="#475569"/><text x="290" y="217">2 Clips</text><text x="290" y="238" font-size="12" font-weight="400" fill="#94a3b8">VEO / Seedance / Kling</text>
      <rect x="390" y="190" width="150" height="64" rx="12" fill="#1e293b" stroke="#475569"/><text x="465" y="217">3 Voice swap</text><text x="465" y="238" font-size="12" font-weight="400" fill="#94a3b8">one locked voice</text>
      <rect x="565" y="190" width="150" height="64" rx="12" fill="#1e293b" stroke="#475569"/><text x="640" y="217">4 Overlays</text><text x="640" y="238" font-size="12" font-weight="400" fill="#94a3b8">Remotion, after clips</text>
      <rect x="740" y="190" width="150" height="64" rx="12" fill="#1e293b" stroke="#475569"/><text x="815" y="217">5 Rough cut</text><text x="815" y="238" font-size="12" font-weight="400" fill="#94a3b8">A/V duration gate</text>
      <rect x="915" y="190" width="245" height="64" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="1037" y="217">6 You approve</text><text x="1037" y="238" font-size="12" font-weight="400" fill="#fbbf24">then the next kelompok starts</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M190 222 H211"/><path d="M365 222 H386"/><path d="M540 222 H561"/><path d="M715 222 H736"/><path d="M890 222 H911"/>
    </g>

    <!-- final -->
    <rect x="40" y="300" width="1120" height="70" rx="14" fill="#10281f" stroke="#34d399"/>
    <text x="600" y="330" font-size="17" font-weight="700" fill="#6ee7b7">--final: join, SFX, captions, music, loudness</text>
    <text x="600" y="354" font-size="13" fill="#94a3b8">One global pass over the approved kelompok. A revision re-runs the whole chain, so nothing stale ships.</text>
    <path d="M600 262 V296" stroke="#64748b" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M594 289 l6 8 6 -8" stroke="#64748b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
