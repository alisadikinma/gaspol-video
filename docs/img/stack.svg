<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Production stack</title>
  <desc id="d">Claude Code orchestrates image, video, voice, Remotion and ffmpeg tools, with a library of reference documents behind it.</desc>
  <rect width="1200" height="420" rx="20" fill="#0b1020"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="42" font-size="22" font-weight="700" fill="#e2e8f0">Best tool per job. One plan holds them together.</text>

    <rect x="330" y="70" width="540" height="76" rx="16" fill="#2a1a05" stroke="#f59e0b" stroke-width="2"/>
    <text x="600" y="102" font-size="19" font-weight="800" fill="#fbbf24">Claude Code · gaspol-video</text>
    <text x="600" y="126" font-size="13" fill="#cbd5e1">11 skills · 2 agents · 37 CLI tools · 41 reference docs (RAG)</text>

    <g fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round">
      <path d="M600 146 V170"/><path d="M130 170 H1070"/>
      <path d="M130 170 V196"/><path d="M365 170 V196"/><path d="M600 170 V196"/><path d="M835 170 V196"/><path d="M1070 170 V196"/>
    </g>

    <g>
      <rect x="30" y="196" width="200" height="150" rx="14" fill="#1e293b" stroke="#22d3ee"/>
      <text x="130" y="226" font-size="16" font-weight="700" fill="#67e8f9">Images</text>
      <g font-size="13" fill="#cbd5e1"><text x="130" y="254">Nano Banana 2</text><text x="130" y="274">gpt-image-2</text><text x="130" y="294">identity-locked refs</text><text x="130" y="314">in-session render offer</text></g>
    </g>
    <g>
      <rect x="265" y="196" width="200" height="150" rx="14" fill="#1e293b" stroke="#a78bfa"/>
      <text x="365" y="226" font-size="16" font-weight="700" fill="#c4b5fd">Video</text>
      <g font-size="13" fill="#cbd5e1"><text x="365" y="254">VEO 3.1 (8 s, extend)</text><text x="365" y="274">Seedance 2.0 (2K, 15 s)</text><text x="365" y="294">Kling 3.0 (3–15 s)</text><text x="365" y="314">or mix per scene</text></g>
    </g>
    <g>
      <rect x="500" y="196" width="200" height="150" rx="14" fill="#1e293b" stroke="#f59e0b"/>
      <text x="600" y="226" font-size="16" font-weight="700" fill="#fbbf24">Voice</text>
      <g font-size="13" fill="#cbd5e1"><text x="600" y="254">ElevenLabs TTS</text><text x="600" y="274">speech-to-speech</text><text x="600" y="294">SFX + music</text><text x="600" y="314">AssemblyAI timing</text></g>
    </g>
    <g>
      <rect x="735" y="196" width="200" height="150" rx="14" fill="#1e293b" stroke="#34d399"/>
      <text x="835" y="226" font-size="16" font-weight="700" fill="#6ee7b7">Readable shots</text>
      <g font-size="13" fill="#cbd5e1"><text x="835" y="254">Remotion</text><text x="835" y="274">kinetic captions</text><text x="835" y="294">app screens + screencasts</text><text x="835" y="314">tracked screen overlays</text></g>
    </g>
    <g>
      <rect x="970" y="196" width="200" height="150" rx="14" fill="#1e293b" stroke="#f87171"/>
      <text x="1070" y="226" font-size="16" font-weight="700" fill="#fca5a5">Assembly</text>
      <g font-size="13" fill="#cbd5e1"><text x="1070" y="254">ffmpeg</text><text x="1070" y="274">vidkit library</text><text x="1070" y="294">loudnorm, ducking</text><text x="1070" y="314">stems, BT.709</text></g>
    </g>
    <text x="600" y="392" font-size="13" fill="#94a3b8">No video platform renders legible text. So readable scenes are coded in Remotion, never generated.</text>
  </g>
</svg>
