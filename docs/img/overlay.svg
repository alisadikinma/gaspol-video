<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">Kinetic overlay</title>
  <desc id="d">Keywords move on screen, and image panels sit behind the speaker through a per-frame person mask.</desc>
  <rect width="1200" height="440" rx="20" fill="#0b1020"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="600" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#e2e8f0">Keywords, not subtitles. Pictures behind the speaker.</text>

    <!-- layer stack -->
    <g transform="translate(60,80)">
      <text x="110" y="-10" text-anchor="middle" font-size="13" font-weight="700" fill="#94a3b8">LAYER 1 · clip</text>
      <rect x="0" y="0" width="220" height="300" rx="14" fill="#1e293b" stroke="#475569"/>
      <circle cx="110" cy="120" r="38" fill="#475569"/><path d="M40 290 q70 -120 140 0 z" fill="#475569"/>
    </g>
    <g transform="translate(330,80)">
      <text x="110" y="-10" text-anchor="middle" font-size="13" font-weight="700" fill="#67e8f9">LAYER 2 · panels behind</text>
      <rect x="0" y="0" width="220" height="300" rx="14" fill="#1e293b" stroke="#22d3ee"/>
      <rect x="18" y="40" width="184" height="70" rx="8" fill="#0e7490"/><rect x="18" y="124" width="86" height="60" rx="8" fill="#155e75"/><rect x="116" y="124" width="86" height="60" rx="8" fill="#164e63"/>
      <circle cx="50" cy="240" r="26" fill="#0891b2"/><circle cx="110" cy="240" r="26" fill="#0e7490"/><circle cx="170" cy="240" r="26" fill="#155e75"/>
    </g>
    <g transform="translate(600,80)">
      <text x="110" y="-10" text-anchor="middle" font-size="13" font-weight="700" fill="#c4b5fd">LAYER 3 · person matte</text>
      <rect x="0" y="0" width="220" height="300" rx="14" fill="#0b1020" stroke="#a78bfa"/>
      <circle cx="110" cy="120" r="38" fill="#fff"/><path d="M40 290 q70 -120 140 0 z" fill="#fff"/>
      <text x="110" y="60" text-anchor="middle" font-size="12" fill="#a78bfa">per-frame mask</text>
    </g>
    <g transform="translate(870,80)">
      <text x="110" y="-10" text-anchor="middle" font-size="13" font-weight="700" fill="#fbbf24">RESULT</text>
      <rect x="0" y="0" width="220" height="300" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <rect x="14" y="30" width="192" height="64" rx="8" fill="#0e7490" opacity="0.9"/>
      <rect x="14" y="110" width="90" height="56" rx="8" fill="#155e75" opacity="0.9"/><rect x="116" y="110" width="90" height="56" rx="8" fill="#164e63" opacity="0.9"/>
      <circle cx="110" cy="130" r="38" fill="#cbd5e1"/><path d="M40 290 q70 -120 140 0 z" fill="#cbd5e1"/>
      <text x="110" y="214" text-anchor="middle" font-size="12" fill="#e2e8f0">only</text>
      <text x="110" y="248" text-anchor="middle" font-size="34" font-weight="900" fill="#fbbf24">3 DAYS</text>
      <rect x="40" y="256" width="140" height="4" rx="2" fill="#f59e0b"/>
    </g>
    <g fill="#64748b" font-size="30" font-weight="700" text-anchor="middle"><text x="297" y="240">+</text><text x="567" y="240">+</text><text x="837" y="240">=</text></g>

    <text x="600" y="420" text-anchor="middle" font-size="14" fill="#cbd5e1">Six text effects: blur-to-sharp, glitch slices, count-up, handwrite, stroke draw, exit. Timed from the voice's own words.</text>
  </g>
</svg>
