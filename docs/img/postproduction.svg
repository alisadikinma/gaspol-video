<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Five post-production passes</title>
  <desc id="d">Voice-over, assembly, SFX, captions and music, final mix. Each pass has its own measured gate.</desc>
  <rect width="1200" height="420" rx="20" fill="#0b1020"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="42" font-size="22" font-weight="700" fill="#e2e8f0">Five passes, fixed order, every one measured.</text>

    <g>
      <rect x="30" y="76" width="212" height="250" rx="16" fill="#1e293b" stroke="#f59e0b"/>
      <circle cx="136" cy="112" r="20" fill="#f59e0b"/><text x="136" y="119" font-size="20" font-weight="800" fill="#1b1140">1</text>
      <text x="136" y="160" font-size="19" font-weight="700" fill="#fff">Voice</text>
      <g font-size="12.5" fill="#94a3b8"><text x="136" y="188">ElevenLabs TTS per cast voice</text><text x="136" y="208">speech-to-speech on spans</text><text x="136" y="228">[pause: 1.2s] = exact silence</text><text x="136" y="248">cached: no re-bill</text></g>
      <text x="136" y="296" font-size="12" font-weight="700" fill="#fbbf24">GATE  drift under 0.05 s</text>
    </g>
    <g>
      <rect x="254" y="76" width="212" height="250" rx="16" fill="#1e293b" stroke="#22d3ee"/>
      <circle cx="360" cy="112" r="20" fill="#22d3ee"/><text x="360" y="119" font-size="20" font-weight="800" fill="#0b1020">2</text>
      <text x="360" y="160" font-size="19" font-weight="700" fill="#fff">Assemble</text>
      <g font-size="12.5" fill="#94a3b8"><text x="360" y="188">ffmpeg trim, pad, concat</text><text x="360" y="208">dissolves at act changes</text><text x="360" y="228">auto punch-in on static shots</text><text x="360" y="248">BT.709 colour, stage cache</text></g>
      <text x="360" y="296" font-size="12" font-weight="700" fill="#67e8f9">GATE  A/V duration</text>
    </g>
    <g>
      <rect x="478" y="76" width="212" height="250" rx="16" fill="#1e293b" stroke="#a78bfa"/>
      <circle cx="584" cy="112" r="20" fill="#a78bfa"/><text x="584" y="119" font-size="20" font-weight="800" fill="#0b1020">3</text>
      <text x="584" y="160" font-size="19" font-weight="700" fill="#fff">Sound design</text>
      <g font-size="12.5" fill="#94a3b8"><text x="584" y="188">cues from your domain brief</text><text x="584" y="208">layered stacks, library first</text><text x="584" y="228">snapped to music beats</text><text x="584" y="248">audibility is measured</text></g>
      <text x="584" y="296" font-size="12" font-weight="700" fill="#c4b5fd">GATE  you read the cue sheet</text>
    </g>
    <g>
      <rect x="702" y="76" width="212" height="250" rx="16" fill="#1e293b" stroke="#34d399"/>
      <circle cx="808" cy="112" r="20" fill="#34d399"/><text x="808" y="119" font-size="20" font-weight="800" fill="#0b1020">4</text>
      <text x="808" y="160" font-size="19" font-weight="700" fill="#fff">Captions + music</text>
      <g font-size="12.5" fill="#94a3b8"><text x="808" y="188">text from the script, never ASR</text><text x="808" y="208">word-by-word kinetic reveal</text><text x="808" y="228">bed composed to the picture</text><text x="808" y="248">ducks 12 dB under the voice</text></g>
      <text x="808" y="296" font-size="12" font-weight="700" fill="#6ee7b7">GATE  headroom measured</text>
    </g>
    <g>
      <rect x="926" y="76" width="244" height="250" rx="16" fill="#1e293b" stroke="#f87171"/>
      <circle cx="1048" cy="112" r="20" fill="#f87171"/><text x="1048" y="119" font-size="20" font-weight="800" fill="#0b1020">5</text>
      <text x="1048" y="160" font-size="19" font-weight="700" fill="#fff">Final mix</text>
      <g font-size="12.5" fill="#94a3b8"><text x="1048" y="188">sidechain duck, two-pass loudnorm</text><text x="1048" y="208">stems for a human editor</text><text x="1048" y="228">second ASR pass reads the master</text><text x="1048" y="248">and diffs it against the script</text></g>
      <text x="1048" y="296" font-size="12" font-weight="700" fill="#fca5a5">GATE  P6 verify, 0 = pass</text>
    </g>

    <text x="600" y="372" font-size="14" fill="#cbd5e1">Missing a key or a binary? The pass says what it skipped and how to fix it. It never pretends.</text>
    <text x="600" y="396" font-size="13" fill="#64748b">A SKIPPED check is reported as SKIPPED, never as PASS.</text>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M242 200 H250"/><path d="M466 200 H474"/><path d="M690 200 H698"/><path d="M914 200 H922"/>
  </g>
</svg>
