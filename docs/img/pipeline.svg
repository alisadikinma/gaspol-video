<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">The seven phase pipeline</title>
  <desc id="d">Brainstorm, script, images, explainer shots, video prompts, post-production, packaging. Every arrow is an approval gate.</desc>
  <rect width="1200" height="420" rx="20" fill="#0b1020"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="44" font-size="22" font-weight="700" fill="#e2e8f0">Seven phases. You approve every handoff.</text>

    <!-- row 1 -->
    <g>
      <rect x="40" y="80" width="250" height="110" rx="16" fill="#1e293b" stroke="#f59e0b"/>
      <text x="165" y="112" font-size="13" fill="#fbbf24" font-weight="700">PHASE 1</text>
      <text x="165" y="140" font-size="21" font-weight="700" fill="#fff">Brainstorm</text>
      <text x="165" y="164" font-size="13" fill="#94a3b8">cast, product, location,</text>
      <text x="165" y="181" font-size="13" fill="#94a3b8">domain research, tone</text>
    </g>
    <g>
      <rect x="350" y="80" width="250" height="110" rx="16" fill="#1e293b" stroke="#f59e0b"/>
      <text x="475" y="112" font-size="13" fill="#fbbf24" font-weight="700">PHASE 2 – 3.5</text>
      <text x="475" y="140" font-size="21" font-weight="700" fill="#fff">Script + References</text>
      <text x="475" y="164" font-size="13" fill="#94a3b8">7-beat arc, scene plan,</text>
      <text x="475" y="181" font-size="13" fill="#94a3b8">hard-block ref gate</text>
    </g>
    <g>
      <rect x="660" y="80" width="250" height="110" rx="16" fill="#1e293b" stroke="#22d3ee"/>
      <text x="785" y="112" font-size="13" fill="#67e8f9" font-weight="700">PHASE 4</text>
      <text x="785" y="140" font-size="21" font-weight="700" fill="#fff">Images (NB2)</text>
      <text x="785" y="164" font-size="13" fill="#94a3b8">asset library, then one</text>
      <text x="785" y="181" font-size="13" fill="#94a3b8">keyframe per clip</text>
    </g>
    <g>
      <rect x="950" y="80" width="210" height="110" rx="16" fill="#1e293b" stroke="#22d3ee"/>
      <text x="1055" y="112" font-size="13" fill="#67e8f9" font-weight="700">PHASE 4.5</text>
      <text x="1055" y="140" font-size="21" font-weight="700" fill="#fff">Explainer</text>
      <text x="1055" y="164" font-size="13" fill="#94a3b8">readable scenes are</text>
      <text x="1055" y="181" font-size="13" fill="#94a3b8">coded in Remotion</text>
    </g>

    <!-- row 2 -->
    <g>
      <rect x="40" y="250" width="320" height="110" rx="16" fill="#1e293b" stroke="#a78bfa"/>
      <text x="200" y="282" font-size="13" fill="#c4b5fd" font-weight="700">PHASE 5</text>
      <text x="200" y="310" font-size="21" font-weight="700" fill="#fff">Video prompts</text>
      <text x="200" y="334" font-size="13" fill="#94a3b8">VEO 3.1, Seedance 2.0, Kling 3.0,</text>
      <text x="200" y="351" font-size="13" fill="#94a3b8">or mixed per scene</text>
    </g>
    <g>
      <rect x="440" y="250" width="320" height="110" rx="16" fill="#1e293b" stroke="#34d399"/>
      <text x="600" y="282" font-size="13" fill="#6ee7b7" font-weight="700">PHASE 6</text>
      <text x="600" y="310" font-size="21" font-weight="700" fill="#fff">Post-production</text>
      <text x="600" y="334" font-size="13" fill="#94a3b8">voice, edit, SFX, captions,</text>
      <text x="600" y="351" font-size="13" fill="#94a3b8">music, final mix</text>
    </g>
    <g>
      <rect x="840" y="250" width="320" height="110" rx="16" fill="#1e293b" stroke="#f87171"/>
      <text x="1000" y="282" font-size="13" fill="#fca5a5" font-weight="700">PHASE 7</text>
      <text x="1000" y="310" font-size="21" font-weight="700" fill="#fff">Packaging</text>
      <text x="1000" y="334" font-size="13" fill="#94a3b8">locked title, three thumbnail</text>
      <text x="1000" y="351" font-size="13" fill="#94a3b8">bets, description</text>
    </g>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M290 135 H346"/><path d="M342 129 l8 6 -8 6"/>
    <path d="M600 135 H656"/><path d="M652 129 l8 6 -8 6"/>
    <path d="M910 135 H946"/><path d="M942 129 l8 6 -8 6"/>
    <path d="M1055 190 V215 H200 V246"/><path d="M194 238 l6 8 6 -8"/>
    <path d="M360 305 H436"/><path d="M432 299 l8 6 -8 6"/>
    <path d="M760 305 H836"/><path d="M832 299 l8 6 -8 6"/>
  </g>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#fbbf24" text-anchor="middle">
    <circle cx="318" cy="135" r="9" fill="#f59e0b"/><circle cx="628" cy="135" r="9" fill="#f59e0b"/><circle cx="928" cy="135" r="9" fill="#f59e0b"/>
    <circle cx="398" cy="305" r="9" fill="#f59e0b"/><circle cx="798" cy="305" r="9" fill="#f59e0b"/>
  </g>
  <text x="600" y="400" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8">Amber dots are approval gates. Phase 6 waits until you have rendered the platform clips: post-production runs on video, not on prompts.</text>
</svg>
